<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <title>IVA por clave · KOGU</title>
  <link rel="stylesheet" href="/assets/styles.css"/>
  <style>
    .iva-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
    .iva-reglas{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.55;max-width:760px}
    .iva-reglas b{color:var(--text)}
    .iva-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .iva-tools .select{width:auto;min-width:110px}
    .iva-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
    .iva-kpi{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
    .iva-kpi:hover{border-color:#94a3b8}
    .iva-kpi.on{border-color:#0f172a;box-shadow:0 0 0 2px rgba(15,23,42,.08)}
    .iva-kpi .l{font-size:12px;color:var(--muted)}
    .iva-kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
    .iva-kpi.warn .v{color:var(--warn)}
    .iva-kpi.danger .v{color:var(--danger)}
    .iva-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
    .iva-tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
    .iva-tab.on{color:var(--text);border-bottom-color:#0f172a}
    .iva-tab .n{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:999px;background:#e2e8f0;color:#475569;font-size:11px}
    .iva-filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
    .iva-filtros .input{max-width:320px}
    .iva-filtros .select{width:auto}
    .iva-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .iva-tasa{font-weight:700;font-variant-numeric:tabular-nums}
    .iva-nota{font-size:11.5px;color:var(--muted);line-height:1.35}
    .iva-nota .alerta{color:var(--danger);font-weight:700}
    .iva-clave{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap}
    .iva-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
    .iva-opciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .iva-opciones label{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center;font-weight:700}
    .iva-opciones label:has(input:checked){border-color:#0f172a;background:#0f172a;color:#fff}
    .iva-opciones input{position:absolute;opacity:0;pointer-events:none}
    .iva-conteos{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 14px}
    .iva-conteos b{color:var(--text)}
    .iva-hist{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
    #ivaModal .modal-card{width:min(560px,96vw)}
    textarea.input{min-height:80px;resize:vertical;font-family:inherit}
    /* La tabla es ancha: sin esto el min-content de la tabla ensancha .main
       en pantallas chicas y la página entera se desborda a lo ancho. */
    main.main{min-width:0}
    .iva-page{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
    .iva-page>.card{min-width:0}
    #paneCatalogo td .badge,#paneExcepciones td .badge{white-space:nowrap}
    #paneCatalogo th,#paneExcepciones th{white-space:nowrap}
    #paneCatalogo td .btn{white-space:nowrap}
    @media (max-width:640px){ .iva-filtros .input{max-width:none} }
  </style>
</head><body>
  <div id="app"></div>
  <script src="/assets/config.js"></script>
  <script src="/assets/api.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="/assets/shell.js"></script>
  <script src="./iva.js"></script>
</body></html>
